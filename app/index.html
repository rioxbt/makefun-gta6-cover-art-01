<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — cover art from a photo and a caption</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="studio">
  <aside class="rail">
    <header class="brand"><h1>Vice Cover Studio</h1></header>
    <p class="tag">A photo and a caption into poster-style cover art. Runs offline; your photos never leave this machine.</p>
    <label class="field">Title<input id="title" type="text" maxlength="24" value="Neon Shore"></label>
    <label class="field">Subtitle<input id="sub" type="text" maxlength="28" value="Leilani Vega"></label>
    <div class="row">
      <label class="file">Add photos<input id="files" type="file" accept="image/*" multiple></label>
      <button id="fill" class="ghost" type="button">Fill panels</button>
    </div>
    <div class="group"><span class="cap">Photos</span><div class="strip" id="thumbs"></div></div>
    <div class="group"><span class="cap">Layout</span><div class="chips" id="layouts"></div></div>
    <div class="group"><span class="cap">Grade</span><div class="chips" id="grades"></div></div>
    <div class="group"><span class="cap">Post size</span><div class="chips" id="sizes"></div></div>
    <label class="field">Zoom<input id="zoom" type="range" min="0.6" max="2.6" step="0.02" value="1"></label>
    <button id="export" class="primary" type="button">Export PNG</button>
    <p id="status" class="status" role="status"></p>
  </aside>
  <section class="stage" id="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="Cover art preview"></canvas>
    <p class="hint">Click a panel, click a thumbnail to place a photo, drag to position, scroll to zoom.</p>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
